name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout 🎾
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java ♨️
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Android SDK 🎁
        uses: android-actions/setup-android@v4
        with:
          # Default packages input includes the obsolete "tools" package,
          # which Google stopped serving (2026-09-15). cmdline-tools (where
          # sdkmanager itself lives) is already installed by this action
          # separately, so dropping "tools" here just skips the broken
          # legacy install without losing anything the build needs.
          packages: "platform-tools"

      - name: Run ktlint & detekt 🧹
        run: ./gradlew link:ktlintCheck link:detekt

      - name: Run lint 🧼
        run: ./gradlew link:lintRelease

      - name: Run tests & coverage verification 🥁
        run: ./gradlew link:jacocoCoverageVerification

      - name: Build 🧩
        run: ./gradlew link:assembleRelease

      - name: Run sonar ✅
        timeout-minutes: 10
        run: ./gradlew link:sonar
        env:
          ORG_GRADLE_PROJECT_sonarProjectKey: ${{ vars.SONAR_PROJECT_KEY }}
          ORG_GRADLE_PROJECT_sonarOrganization: ${{ vars.SONAR_ORGANIZATION }}
          ORG_GRADLE_PROJECT_sonarHostUrl: ${{ vars.SONAR_HOST_URL }}
          ORG_GRADLE_PROJECT_sonarToken: ${{ secrets.SONAR_TOKEN }}
